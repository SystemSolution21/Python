[project]
name = "tutorial"
version = "0.1.0"
description = "Python Tutorial"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pipe>=2.2",
    "requests>=2.32.3",
    "ipykernel>=6.29.5",
    "websockets>=15.0.1",
    "fpdf>=1.7.2",
    "typer>=0.20.0",
    "dotenv>=0.9.9",
    "pydantic[email]>=2.12.5",
]

[dependency-groups]
test = [
    "pytest>=8.3.4",
    "pytest-mock>=3.14.0",
]
dev = [
    "ruff>=0.11.12",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = []

[tool.ruff.lint]
# Keep reporting F401 warnings, but never auto-fix/remove them
unfixable = ["F401"]